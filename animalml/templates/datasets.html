<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dataset Selection - AnimalML</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container py-5">
        <!-- Back and Home buttons -->
        <div class="mb-3">
            <a href="javascript:history.back()" class="btn btn-secondary btn-lg">Back</a>
            <a href="/" class="btn btn-primary btn-lg">Home</a>
        </div>

        <h1 class="display-4 fw-bold text-primary">Dataset Selection</h1>
        <p class="lead">Select a dataset and configure parameters for training.</p>

        <!-- Form for Dataset -->
        <form action="/select_dataset" method="POST">
            
            <!-- Dropdown for selecting dataset -->
            <div class="mb-3">
                <label for="datasetSelection" class="form-label">Select Dataset</label>
                <select class="form-select" id="datasetSelection" name="datasetSelection" onchange="loadClasses()">
                    <option value="">Select dataset</option>
                    {% for dataset in datasets %}
                        <option value="{{ dataset }}">{{ dataset }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Display dataset classes based on the selection -->
            <div class="mb-3" id="classSelectionContainer" style="display:none;">
                <label for="classSelection" class="form-label">Classes in the Dataset</label>
                <ul id="classList" class="list-group">
                    <!-- Dynamic list of classes will go here -->
                </ul>
            </div>

            <!-- Number of images per class input -->
            <div class="mb-3">
                <label for="imagesPerClass" class="form-label">Number of Images per Class</label>
                <input type="number" class="form-control" id="imagesPerClass" name="imagesPerClass" min="1" required>
            </div>

            <!-- Random seed input -->
            <div class="mb-3">
                <label for="randomSeed" class="form-label">Random Seed</label>
                <input type="number" class="form-control" id="randomSeed" name="randomSeed" min="0" required>
            </div>

            <!-- Submit button -->
            <button type="submit" class="btn btn-primary btn-lg">Submit</button>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Separate external JS file -->
    <script src="{{ url_for('static', filename='js/datasets.js') }}"></script>

</body>
</html>
