<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Training - AnimalML</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container py-5">
        <!-- Back and Home buttons -->
        <div class="mb-3">
            <a href="javascript:history.back()" class="btn btn-secondary btn-lg">Back</a>
            <a href="/" class="btn btn-primary btn-lg">Home</a>
        </div>

    <div class="container py-5">
        <h1 class="display-4 fw-bold text-primary">Training</h1>
        <p class="lead">Set up training parameters and choose the model for training.</p>

        <!-- Form for Training -->
        <form action="/run_training" method="POST" enctype="multipart/form-data">
            <!-- File selection for input (similar to inference) -->
            <div class="mb-3">
                <label for="inputFile" class="form-label">Input Directory / File</label>
                <input type="file" class="form-control" id="inputFile" name="inputFile" required>
            </div>

            <!-- Epoch field -->
            <div class="mb-3">
                <label for="epochs" class="form-label">Number of Epochs</label>
                <input type="number" class="form-control" id="epochs" name="epochs" min="1" required>
            </div>

            <!-- Checkbox for saving output -->
            <div class="mb-3">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="saveOutput" name="saveOutput">
                    <label class="form-check-label" for="saveOutput">Save training output</label>
                </div>
            </div>

            <!-- Dropdown for selecting model -->
            <div class="mb-3">
                <label for="modelSelection" class="form-label">Model Selection</label>
                <select class="form-select" id="modelSelection" name="modelSelection">
                    <option value="">Select model</option>
                    <option value="cnn_model_1">CNN Model 1</option>
                    <option value="cnn_model_2">CNN Model 2</option>
                    <option value="cnn_model_3">CNN Model 3</option>
                    <!-- Add more CNN models here as needed -->
                </select>
            </div>

            <!-- Run button -->
            <button type="submit" class="btn btn-primary btn-lg">Start Training</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
