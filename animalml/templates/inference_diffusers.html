<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inference - AnimalML</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container py-5">
        <!-- Back and Home buttons -->
        <div class="mb-3">
            <a href="javascript:history.back()" class="btn btn-secondary btn-lg">Back</a>
            <a href="/" class="btn btn-primary btn-lg">Home</a>
        </div>

    <div class="container py-5">
        <h1 class="display-4 fw-bold text-primary">Inference</h1>
        <p class="lead">Select the necessary options for inference processing.</p>

        <!-- Form for Inference -->
        <form action="/run_inference" method="POST" enctype="multipart/form-data">
            <!-- File selection with browse button -->
            <div class="mb-3">
                <label for="inputFile" class="form-label">Input Directory / File</label>
                <input type="file" class="form-control" id="inputFile" name="inputFile" required>
            </div>

            <!-- Toggle switches -->
            <div class="mb-3">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="detectionOnly" name="detectionOnly">
                    <label class="form-check-label" for="detectionOnly">Detection only</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="saveSegmentation" name="saveSegmentation">
                    <label class="form-check-label" for="saveSegmentation">Save segmentations</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="saveBoundingBoxes" name="saveBoundingBoxes">
                    <label class="form-check-label" for="saveBoundingBoxes">Save bounding boxes</label>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="displayImages" name="displayImages">
                    <label class="form-check-label" for="displayImages">Display images</label>
                </div>
            </div>

            <!-- Dropdowns for selecting models -->
            <div class="mb-3">
                <label for="detectionModel" class="form-label">Detection/Segmentation Model</label>
                <select class="form-select" id="detectionModel" name="detectionModel">
                    <option value="">Select model</option>
                    <option value="model1">Model 1</option>
                    <option value="model2">Model 2</option>
                    <!-- Add your actual models here -->
                </select>
            </div>

            <div class="mb-3">
                <label for="classificationModel" class="form-label">Classification Model</label>
                <select class="form-select" id="classificationModel" name="classificationModel">
                    <option value="">Select model</option>
                    <option value="classificationModel1">Classification Model 1</option>
                    <option value="classificationModel2">Classification Model 2</option>
                    <!-- Add your actual classification models here -->
                </select>
            </div>

            <!-- Run button -->
            <button type="submit" class="btn btn-primary btn-lg">Run</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
